<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/38e6d61a92.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">
    <form>
      <i class="fas fa-paper-plane"></i>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" onkeyup="validateName()">
        <span id="error1"></span>
      </div>

      <div class="input-group">
        <label>Phone No.</label>
        <input type="tel" id="phone" placeholder="123 456 7890" onkeyup="validatePhone()">
        <span id="error2"></span>
      </div>

      <div class="input-group">
        <label>Email Id</label>
        <input type="email" id="email" placeholder="Enter Email" onkeyup="validateEmail()">
        <span id="error3"></span>
      </div>

      <div class="input-group">
        <label>Your Message</label>
        <textarea rows="1" id="message" placeholder="Enter your message" onkeyup="validateMessage()"></textarea>
        <span id="error4"></span>
        <span id="limit"></span>
      </div>

      <button onclick="return validateForm()">Submit</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>

</html>
